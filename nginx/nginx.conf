
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream cloudguard_apps {
        zone apps 64k;
        server app1:8000 resolve max_fails=1 fail_timeout=5s;
        server app2:8000 resolve max_fails=1 fail_timeout=5s;
    }
    upstream monitoring {
        zone monitoring 64k;
        server monitor:8000 resolve;
    }
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 16k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Cache-Control no-store always;
        location = /healthz {
            default_type application/json;
            return 200 '{"status":"healthy","component":"nginx"}';
        }
        location = /dashboard { try_files /dashboard.html =404; }
        location /api/app/ {
            proxy_pass http://cloudguard_apps/;
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
        location /api/monitor/ {
            proxy_pass http://monitoring/;
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
