
name: cloudguard

x-app: &app
  build: ./backend
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 2
    start_period: 10s
  networks: [cloudguard]

services:
  app1:
    <<: *app
    environment:
      INSTANCE_ID: app-1
  app2:
    <<: *app
    environment:
      INSTANCE_ID: app-2
  monitor:
    build: ./monitor
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DB_PATH: /data/cloudguard.db
      TARGETS_FILE: /config/targets.yaml
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-5}
      CHECK_TIMEOUT_SECONDS: ${CHECK_TIMEOUT_SECONDS:-2}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      # Public, browser-safe key; targets.yaml has the same default. Never a secret key.
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    volumes:
      - monitoring-data:/data
      # Edit targets.yaml, then: docker compose restart monitor (no rebuild needed).
      - ./monitor/targets.yaml:/config/targets.yaml:ro
    depends_on:
      app1: {condition: service_healthy}
      app2: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [cloudguard]
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLOUDGUARD_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      app1: {condition: service_healthy}
      app2: {condition: service_healthy}
      monitor: {condition: service_started}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 5s
      timeout: 3s
      retries: 3
    networks: [cloudguard]

volumes:
  monitoring-data:
networks:
  cloudguard:
